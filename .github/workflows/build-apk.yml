name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/redesign-gamificado-aprovafox

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vunesp-quickdrill-aprovafox-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AprovaFox APK (Instalador Android)
          body: |
            ### VUNESP QuickDrill (AprovaFox) - APK Android

            - **Versão:** 1.0.0
            - **Build:** Android Nativo (Offline completo, SRS, Simulados e Banco de 175 questões)
            - **Instalação:** Baixe o arquivo `app-debug.apk` no seu celular Xiaomi/Android e toque para instalar.
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
