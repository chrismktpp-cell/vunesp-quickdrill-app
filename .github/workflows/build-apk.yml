name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/redesign-gamificado-aprovafox

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean

      - name: Build APK with Gradle (Release com bundle JS embutido)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../aprovafox-vunesp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aprovafox-vunesp-apk
          path: aprovafox-vunesp.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AprovaFox APK (Instalador Android 100% Offline)
          body: |
            ### VUNESP QuickDrill (AprovaFox) - APK Android 100% Offline

            - **Versão:** 1.0.0
            - **Modo:** Standalone Release (Bundle JavaScript e assets embutidos nativamente)
            - **Instalação:** Baixe o arquivo `aprovafox-vunesp.apk` no seu celular Xiaomi/Android e toque para instalar.
          files: |
            aprovafox-vunesp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
